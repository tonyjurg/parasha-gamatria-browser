# Keep these jobs aligned with quality.yml and the Pages build; tests check parity.
name: Ubuntu 26 Compatibility
'on':
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ubuntu-26-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    name: Ubuntu 26.04 JavaScript lint and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Install locked lint dependencies
      run: npm ci --ignore-scripts
    - name: Lint JavaScript
      run: npm run lint
    - name: Test browser and compact data
      run: npm test
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }} lint and tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-26.04
          python-version: '3.11'
        - os: ubuntu-26.04
          python-version: '3.13'
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install development dependencies
      run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'
    - name: Check dependency consistency
      run: python -m pip check
    - name: Lint Python and notebook
      run: python -m ruff check . --output-format=github
    - name: Test committed data and optimization-safe validation
      run: python -m pytest -q
  pages-build:
    needs:
    - javascript
    - python
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Configure Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
    - name: Upload static website only
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: site
        name: ubuntu-26-pages-smoke-test
        retention-days: 1
    name: Ubuntu 26.04 Pages artifact smoke test
